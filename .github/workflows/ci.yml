name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    name: Spark + dbt pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Tests (includes PySpark-vs-DuckDB parity and the dbt build)
        run: pytest -q -rs -W ignore::DeprecationWarning
      - name: Full pipeline with the PySpark engine
        run: |
          python -m data_gen.generate --landing data/landing
          python -m pipeline.run --engine spark
          cd dbt
          dbt build --profiles-dir .
          dbt docs generate --profiles-dir .
      - name: Show silver metrics
        run: cat data/metrics.json
      - uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: |
            dbt/target/index.html
            dbt/target/catalog.json
            dbt/target/manifest.json
            data/metrics.json

  dag:
    name: Airflow DAG import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Airflow with its constraints file
        run: |
          pip install "apache-airflow==2.10.5" pytest \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.11.txt"
      - run: pytest tests_dag -q
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
